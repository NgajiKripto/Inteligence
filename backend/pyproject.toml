[project]
name = "memecoin-intelligence"
version = "1.0.0"
description = "AI-powered memecoin trading analysis platform with multi-agent simulation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MemeCoin Intelligence Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM
    "openai>=1.0.0",
    
    # Data & HTTP
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    
    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
